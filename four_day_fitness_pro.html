<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091322"><title>Four Day Fitness Pro</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#edf4ff;background:#08111f}*{box-sizing:border-box}body{margin:0;padding-bottom:calc(88px + env(safe-area-inset-bottom));background:linear-gradient(150deg,#0c1b30,#08111f 55%)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:calc(20px + env(safe-area-inset-top)) 18px 16px;max-width:800px;margin:auto}h1{margin:3px 0;font-size:27px;letter-spacing:-.8px}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 7px}.eyebrow{color:#66e0bc;text-transform:uppercase;font-weight:800;letter-spacing:2px;font-size:10px}.muted{color:#9aaec9;font-size:13px}.sub{margin:5px 0 0}.wrap{max-width:800px;margin:auto;padding:0 14px}.panel{background:#142238;border:1px solid #293c58;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 9px 25px #0002}.hero{background:linear-gradient(135deg,#1d3d65,#163a40)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{font-size:27px;font-weight:850;letter-spacing:-1px}.statbox{padding:14px;background:#0e1b30;border-radius:14px}.tag{background:#1b4655;color:#9ff3da;padding:6px 10px;border-radius:50px;font-size:12px;font-weight:750}.tabs{position:fixed;bottom:0;left:0;right:0;background:#101d30ee;backdrop-filter:blur(15px);border-top:1px solid #35465c;display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:9}.tab{border:0;background:transparent;color:#a5b6cf;padding:9px 0;border-radius:12px;font-size:12px;font-weight:750}.tab.active{background:#2865c4;color:#fff}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.day{background:#0d1a2c;border:1px solid #30445f;color:#d7e7fb;padding:12px 3px;border-radius:10px;font-weight:750}.day.active{background:#285eb4;border-color:#75a6ff}.exercise{border-top:1px solid #2a3c56;padding:15px 0}.exercise:first-of-type{border:0}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}.field label{display:block;font-size:11px;color:#aabbd1;margin:0 0 5px}.field input,.field select,textarea{width:100%;min-width:0;background:#0a1628;color:#fff;border:1px solid #425873;border-radius:10px;padding:11px;font-size:16px}textarea{min-height:72px}.hint{font-size:12px;color:#a6d9ff;line-height:1.5}.btn{border:1px solid #527299;border-radius:11px;padding:10px 12px;background:#203650;color:white;font-weight:750}.primary{background:#3678e6;border-color:#3678e6}.green{background:#226b57;border-color:#226b57}.full{width:100%;padding:14px;margin-top:9px}.small{font-size:12px;padding:7px 9px}.bar{height:9px;border-radius:20px;background:#263a55;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#3e91ff,#54e1ba);border-radius:20px}.chart{width:100%;height:190px;display:block}.chart text{fill:#a9bad1;font-size:10px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#b9c8db}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.history{padding:13px 0;border-top:1px solid #2b405c}.notice{font-size:12px;line-height:1.5;color:#a7b9d0}.hidden{display:none!important}.toast{position:fixed;bottom:90px;left:20px;right:20px;max-width:450px;margin:auto;background:#226b57;color:#fff;border-radius:12px;padding:12px;text-align:center;z-index:15;display:none}.empty{text-align:center;padding:30px 10px;color:#a5b7cc}.pill{font-size:12px;color:#b9d5ff}.metric{font-size:11px;color:#a9bed5}.progress-row{margin:14px 0}.scroll{overflow-x:auto}.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.heat span{border-radius:6px;text-align:center;padding:10px 0;font-size:11px;background:#1c3048;color:#b1c3d9}.heat .hit{background:#226b57;color:white}.heat .today{outline:2px solid #70adff}input[type=checkbox]{width:22px;height:22px;accent-color:#57d7ad}a{color:#9ccaff}
</style></head><body><header><div class="eyebrow">YOUR TRAINING SYSTEM</div><h1>Four Day Fitness <span style="color:#62d9b4">PRO</span></h1><div class="muted sub">Dumbbells · 2 HIIT days · 50 push-up mission</div></header><main class="wrap" id="app"></main><nav class="tabs" id="nav"></nav><div id="toast" class="toast" role="status"></div><script>
'use strict';const PLAN=[{name:'Monday',title:'Upper Body + Push-ups',type:'Strength',warm:'5-minute easy walk and arm circles',ex:[['Incline or knee push-ups',3,8,'reps',false],['Dumbbell floor press',3,10,'reps',true],['One-arm dumbbell row',3,10,'reps',true],['Dumbbell shoulder press',2,10,'reps',true],['Dumbbell hammer curl',2,12,'reps',true]]},{name:'Tuesday',title:'HIIT Run + Core',type:'HIIT',warm:'5-minute walking warm-up',ex:[['Your HIIT running routine',1,20,'min',false],['Standing knee raises (per side)',3,12,'reps',false],['Dead bugs (per side)',3,8,'reps',false]],cool:'5-minute walking cooldown'},{name:'Wednesday',title:'Full Body + Push-ups',type:'Strength',warm:'5-minute easy walk',ex:[['Incline or knee push-ups',4,6,'reps',false],['Dumbbell goblet squat to chair',3,10,'reps',true],['Dumbbell floor press',3,10,'reps',true],['Dumbbell Romanian deadlift',3,10,'reps',true],['One-arm dumbbell row',3,12,'reps',true]]},{name:'Thursday',title:'HIIT + Light Push-ups',type:'HIIT',warm:'5-minute walking warm-up',ex:[['Your HIIT running routine',1,20,'min',false],['Easy incline push-ups',2,8,'reps',false],['Dumbbell farmer hold',3,30,'sec',true]],cool:'5-minute walking cooldown'}];
const STORE='fourdayfitness-v2';const OLD='fourdayfitness-v1';const empty=()=>({logs:[],push:[],drafts:{},weights:[],settings:{increment:2.5}});let db;try{db=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(OLD)||'null')||empty()}catch{db=empty()}for(const k of ['logs','push','weights'])if(!Array.isArray(db[k]))db[k]=[];if(!db.drafts||typeof db.drafts!=='object')db.drafts={};db.settings ||= {increment:2.5};let view='home',day=Math.min(3,(new Date().getDay()+6)%7),chartExercise='Dumbbell floor press',pushVariation='Knees';const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});const dayKey=t=>{let d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(db))}catch{notify('Storage unavailable: export a backup')}};const notify=s=>{let x=$('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',2600)};const allEntries=()=>db.logs.flatMap(l=>(l.entries||[]).filter(e=>e.done).map(e=>({...e,at:l.at}))).sort((a,b)=>a.at-b.at);const weightedNames=[...new Set(PLAN.flatMap(d=>d.ex.filter(e=>e[4]).map(e=>e[0])))];const num=(x,f=0)=>Number.isFinite(+x)?+x:f;
function lastWeight(name){return [...allEntries()].reverse().find(e=>e.name===name&&num(e.weight)>0)}function advice(name,target){let e=allEntries().filter(x=>x.name===name&&num(x.weight)>0);if(!e.length)return 'First session: choose a light weight you can control with 2–3 reps left in reserve.';let last=e[e.length-1],w=num(last.weight),inc=num(db.settings.increment,2.5)||2.5;let same=e.filter(x=>num(x.weight)===w).slice(-2);if(same.length===2&&same.every(x=>num(x.reps)>=target&&num(x.sets)>=2))return `Try ${+(w+inc).toFixed(2)} lb per dumbbell next time if form stays strong (two successful sessions at ${w} lb).`;return `Repeat ${w} lb per dumbbell; aim for ${target} controlled reps across all sets before increasing.`}
function nav(){ $('nav').innerHTML=[['home','⌂ Home'],['workout','▣ Workout'],['progress','↗ Progress'],['history','◷ History']].map(([k,n])=>`<button class="tab ${view===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('')};function go(v){view=v;render();window.scrollTo(0,0)}function render(){nav();$('app').innerHTML=({home,workout,progress,history})[view]();}
function weeklyCount(){let now=new Date(),m=new Date(now);m.setDate(now.getDate()-(now.getDay()+6)%7);m.setHours(0,0,0,0);return db.logs.filter(l=>l.at>=m.getTime()).length}function best(type){return Math.max(0,...db.push.filter(p=>!type||p.type===type).map(p=>num(p.reps)))}function latestWeight(){return db.weights.length?db.weights[db.weights.length-1].weight:null}function home(){let week=weeklyCount(),last=latestWeight(),types=['Wall','Incline','Knees','Full'];return `<section class="panel hero"><div class="eyebrow">THIS WEEK</div><h2 style="font-size:25px;margin:7px 0">Show up. Get stronger.</h2><p class="muted">Four planned sessions. Progress at your own pace, one set at a time.</p><div class="row"><b>${week} sessions logged</b><span class="tag">Goal: 4/week</span></div><div class="bar" style="margin-top:12px"><div class="fill" style="width:${Math.min(100,week/4*100)}%"></div></div><button class="btn primary full" onclick="go('workout')">Open today's workout</button></section><div class="grid"><div class="statbox"><div class="metric">Total sessions</div><div class="stat">${db.logs.length}</div></div><div class="statbox"><div class="metric">Knee push-up record</div><div class="stat">${best('Knees')} <small style="font-size:12px">/ 50</small></div></div><div class="statbox"><div class="metric">Full push-up record</div><div class="stat">${best('Full')}</div></div><div class="statbox"><div class="metric">Latest body weight</div><div class="stat">${last??'—'} <small style="font-size:12px">lb</small></div></div></div><section class="panel" style="margin-top:14px"><div class="row"><h2>Training split</h2><span class="pill">Mon–Thu</span></div>${PLAN.map((d,i)=>`<div class="history row"><div><b>${d.name}</b><div class="muted">${d.title}</div></div><button class="btn small" onclick="day=${i};go('workout')">Open</button></div>`).join('')}</section><section class="panel"><h2>50 push-up mission</h2><div class="row"><span class="muted">Best knee set</span><b>${best('Knees')} / 50</b></div><div class="bar" style="margin:12px 0"><div class="fill" style="width:${Math.min(100,best('Knees')*2)}%"></div></div><div class="muted">Knee and full push-ups are tracked separately. Test a maximum set every 2–4 weeks, not daily.</div><button class="btn full" onclick="go('progress')">View progress dashboard</button></section>`}
function draft(i,j){return db.drafts[`${i}-${j}`]||{}}function edit(i,j,k,v){db.drafts[`${i}-${j}`]||={};db.drafts[`${i}-${j}`][k]=v;save()}function toggle(i,j,checked){edit(i,j,'done',checked);render()}function workout(){let d=PLAN[day];return `<section class="panel"><h2>Workout logger</h2><div class="days">${PLAN.map((x,i)=>`<button class="day ${day===i?'active':''}" onclick="day=${i};render()">${x.name.slice(0,3)}</button>`).join('')}</div><div class="row"><div><h2 style="margin:0">${d.name}</h2><div class="muted">${d.title}</div></div><span class="tag">${d.type}</span></div><p class="muted">Warm-up: ${d.warm}</p>${d.ex.map((e,j)=>{let [name,sets,reps,unit,weighted]=e,v=draft(day,j),k=`${day},${j}`;return `<div class="exercise"><div class="row"><strong style="flex:1">${safe(name)}</strong><label class="row" style="font-size:12px"><input type="checkbox" ${v.done?'checked':''} onchange="toggle(${k},this.checked)">Done</label></div><div class="fields"><div class="field"><label>Sets</label><input type="number" min="0" max="30" value="${safe(v.sets??sets)}" onchange="edit(${k},'sets',this.value)"></div><div class="field"><label>${unit==='reps'?'Reps / set':unit==='min'?'Minutes':'Seconds / set'}</label><input type="number" min="0" max="999" value="${safe(v.reps??reps)}" onchange="edit(${k},'reps',this.value)"></div><div class="field"><label>${weighted?'lb / dumbbell':'Bodyweight'}</label><input type="number" min="0" step="0.5" ${weighted?'':'disabled'} value="${weighted?safe(v.weight??lastWeight(name)?.weight??''):''}" placeholder="${weighted?'Enter lb':'—'}" onchange="edit(${k},'weight',this.value)"></div></div>${weighted?`<div class="hint">${safe(advice(name,reps))}</div>`:''}</div>`}).join('')}${d.cool?`<p class="muted">Cooldown: ${d.cool}</p>`:''}<div class="field"><label>Workout notes</label><textarea id="notes" oninput="db.drafts['notes'+day]=this.value;save()" placeholder="Energy, difficulty, soreness, wins...">${safe(db.drafts['notes'+day]||'')}</textarea></div><button class="btn primary full" onclick="finish()">Save completed session</button><p class="notice">Only checked exercises count as completed. Suggestions are based on your recorded sessions, not on body weight alone.</p></section>`}
function finish(){let d=PLAN[day],entries=d.ex.map((e,j)=>{let v=draft(day,j);return{name:e[0],sets:num(v.sets??e[1]),reps:num(v.reps??e[2]),weight:e[4]?num(v.weight):0,done:!!v.done,at:Date.now(),unit:e[3]}});if(!entries.some(e=>e.done))return notify('Check off at least one completed exercise.');if(entries.some(e=>e.done&&e.weight<0))return notify('Check the weights entered.');db.logs.push({at:Date.now(),day:d.name,entries,notes:db.drafts['notes'+day]||''});d.ex.forEach((_,j)=>delete db.drafts[`${day}-${j}`]);delete db.drafts['notes'+day];save();go('home');notify('Workout saved — great work!')}
function pointsChart(points,unit=''){let W=340,H=175,pad=28;if(!points.length)return '<div class="empty">Log a few sessions to see your trend.</div>';let ys=points.map(p=>num(p.y)),min=Math.min(0,...ys),max=Math.max(1,...ys),span=max-min||1;let coords=points.map((p,i)=>[pad+(W-2*pad)*(points.length===1?.5:i/(points.length-1)),H-pad-(p.y-min)/span*(H-2*pad)]);let line=coords.map((p,i)=>(i?'L':'M')+p.map(n=>n.toFixed(1)).join(' ')).join(' ');return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress trend chart"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#516781"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#516781"/><path d="${line}" fill="none" stroke="#57d7b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${coords.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#77b6ff"><title>${date(points[i].at)}: ${points[i].y}${unit}</title></circle>`).join('')}<text x="2" y="${pad+3}">${max}${unit}</text><text x="10" y="${H-pad}">${min}</text><text x="${pad}" y="${H-5}">${date(points[0].at).slice(0,6)}</text><text x="${W-pad}" y="${H-5}" text-anchor="end">${date(points[points.length-1].at).slice(0,6)}</text></svg>`}
function progress(){let vals=allEntries().filter(e=>e.name===chartExercise&&num(e.weight)>0).map(e=>({at:e.at,y:num(e.weight)}));let pushes=db.push.filter(p=>p.type===pushVariation).map(p=>({at:p.at,y:num(p.reps)}));let weightPts=db.weights.map(w=>({at:w.at,y:num(w.weight)}));let last=latestWeight(),first=db.weights[0]?.weight;let hiit=db.logs.flatMap(l=>(l.entries||[]).filter(e=>e.done&&e.name==='Your HIIT running routine').map(e=>({at:l.at,y:num(e.reps)})));return `<section class="panel hero"><div class="eyebrow">PERFORMANCE CENTER</div><h2 style="margin-top:8px">Your progress dashboard</h2><div class="grid"><div class="statbox"><div class="metric">Sessions completed</div><div class="stat">${db.logs.length}</div></div><div class="statbox"><div class="metric">HIIT sessions</div><div class="stat">${hiit.length}</div></div><div class="statbox"><div class="metric">Push-up tests</div><div class="stat">${db.push.length}</div></div><div class="statbox"><div class="metric">Body-weight change</div><div class="stat">${last!==null&&first!=null?(last-first>0?'+':'')+(last-first).toFixed(1):'—'} <small style="font-size:12px">lb</small></div></div></div></section><section class="panel"><h2>Dumbbell strength</h2><div class="field"><label>Exercise</label><select onchange="chartExercise=this.value;render()">${weightedNames.map(n=>`<option ${n===chartExercise?'selected':''}>${safe(n)}</option>`).join('')}</select></div>${pointsChart(vals,' lb')}<div class="muted">Shows weight per dumbbell recorded in completed workouts.</div></section><section class="panel"><h2>Push-up progression</h2><div class="field"><label>Push-up variation</label><select onchange="pushVariation=this.value;render()">${['Wall','Incline','Knees','Full'].map(t=>`<option ${t===pushVariation?'selected':''}>${t}</option>`).join('')}</select></div><div class="row" style="margin:12px 0"><span class="muted">Best ${pushVariation.toLowerCase()} set</span><b>${best(pushVariation)} / 50</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,best(pushVariation)*2)}%"></div></div>${pointsChart(pushes,' reps')}<div class="fields" style="grid-template-columns:2fr 1fr"><div class="field"><label>Variation</label><select id="pushType">${['Wall','Incline','Knees','Full'].map(t=>`<option ${t===pushVariation?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Max clean reps</label><input id="pushReps" type="number" min="1" step="1" placeholder="e.g. 8"></div></div><button class="btn primary full" onclick="logPush()">Save push-up test</button><p class="notice">Compare only the same variation and similar form. Test every 2–4 weeks after a rest day.</p></section><section class="panel"><h2>Body-weight trend</h2>${pointsChart(weightPts,' lb')}<div class="fields" style="grid-template-columns:1fr 1fr"><div class="field"><label>Current weight (lb)</label><input id="bodyWeight" type="number" min="1" step="0.1" placeholder="314"></div><div class="field"><label>Date</label><input id="weightDate" type="date" value="${dayKey(Date.now())}"></div></div><button class="btn primary full" onclick="logWeight()">Log body weight</button><p class="notice">Optional. Daily weight can fluctuate; focus on longer-term trends rather than any single reading.</p></section><section class="panel"><h2>HIIT endurance</h2>${pointsChart(hiit,' min')}<p class="notice">Minutes are taken from your saved Tuesday and Thursday HIIT sessions. Use your familiar routine; modify impact or intensity if recovery is difficult.</p></section><section class="panel"><h2>Last 28 days</h2>${heatmap()}</section>`}
function heatmap(){let done=new Set(db.logs.map(l=>dayKey(l.at))),now=new Date();return `<div class="heat">${Array.from({length:28},(_,i)=>{let d=new Date(now);d.setDate(now.getDate()-(27-i));let k=dayKey(d);return `<span class="${done.has(k)?'hit':''} ${i===27?'today':''}" title="${k}">${d.getDate()}</span>`}).join('')}</div><p class="notice">Green indicates at least one saved session that day.</p>`}
function logPush(){let t=$('pushType').value,r=Number($('pushReps').value);if(!Number.isInteger(r)||r<1||r>1000)return notify('Enter a valid positive whole number.');db.push.push({type:t,reps:r,at:Date.now()});db.push.sort((a,b)=>a.at-b.at);pushVariation=t;save();render();notify('Push-up test saved')};function logWeight(){let w=Number($('bodyWeight').value),s=$('weightDate').value;if(!w||w<50||w>1200||!s)return notify('Enter a valid weight and date.');let at=new Date(s+'T12:00:00').getTime();if(at>Date.now()+86400000)return notify('Choose today or an earlier date.');db.weights.push({weight:w,at});db.weights.sort((a,b)=>a.at-b.at);save();render();notify('Body weight saved')}
function history(){return `<section class="panel"><h2>Workout history</h2>${db.logs.length?db.logs.slice().map((l,i)=>({...l,index:i})).reverse().map(l=>`<div class="history"><div class="row"><div><b>${safe(l.day)}</b><div class="muted">${date(l.at)} · ${(l.entries||[]).filter(e=>e.done).length} exercises</div></div><button class="btn small" onclick="removeLog(${l.index})">Delete</button></div><details style="margin-top:8px"><summary class="muted">See logged sets and weights</summary>${(l.entries||[]).filter(e=>e.done).map(e=>`<div class="muted" style="margin:7px 0">${safe(e.name)}: ${num(e.sets)} × ${num(e.reps)} ${safe(e.unit||'reps')}${num(e.weight)>0?' @ '+num(e.weight)+' lb/DB':''}</div>`).join('')}<p class="muted">${safe(l.notes||'')}</p></details></div>`).join(''):'<div class="empty">Your completed workouts will appear here.</div>'}</section><section class="panel"><h2>Push-up tests</h2>${db.push.slice().map((p,i)=>({...p,index:i})).reverse().slice(0,20).map(p=>`<div class="history row"><span>${safe(p.type)} · <b>${num(p.reps)} reps</b><div class="muted">${date(p.at)}</div></span><button class="btn small" onclick="removeItem('push',${p.index})">Delete</button></div>`).join('')||'<p class="muted">No tests yet.</p>'}</section><section class="panel"><h2>Settings & backup</h2><div class="field"><label>Suggested dumbbell increment (lb per dumbbell)</label><select onchange="db.settings.increment=Number(this.value);save();notify('Increment updated')">${[2.5,5,10].map(n=>`<option value="${n}" ${num(db.settings.increment,2.5)===n?'selected':''}>${n} lb</option>`).join('')}</select></div><button class="btn full" onclick="exportData()">Export JSON backup</button><div class="field" style="margin-top:13px"><label>Import backup (replaces current data)</label><input type="file" accept=".json,application/json" onchange="importData(event)"></div><p class="notice">Saved only in this browser's local storage. Data does not sync between browsers, devices, or private tabs. Export regularly, especially before clearing browser data.</p></section><section class="panel"><h2>Training guidance</h2><p class="notice">Suggested increases require two recorded successful sessions at the same weight, but do not guarantee readiness. Keep 2–3 reps in reserve, prioritize technique, and use a lighter load when tired or sore. HIIT running can be high impact; use walking intervals or another low-impact option if joints hurt. Hydrate and avoid exercising through dizziness or significant nausea while on a GLP-1. Seek medical clearance before vigorous exercise if you're newly returning to it.</p></section>`}
function removeLog(i){if(confirm('Delete this workout?')){db.logs.splice(i,1);save();render()}}function removeItem(k,i){if(confirm('Delete this entry?')){db[k].splice(i,1);save();render()}}function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='four-day-fitness-pro-backup-'+dayKey(Date.now())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}function importData(ev){let f=ev.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.logs)||!Array.isArray(x.push))throw Error();if(!confirm('Replace all current tracking data with this backup?'))return;db={...empty(),...x,weights:Array.isArray(x.weights)?x.weights:[],drafts:x.drafts||{},settings:x.settings||{increment:2.5}};save();render();notify('Backup restored')}catch{notify('Invalid backup file')}};r.readAsText(f)}render();
</script></body></html>
